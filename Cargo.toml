[workspace]
resolver = "3"
members = ["crates/common", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/howardzhangdqs/folkmoot"
rust-version = "1.85"

[workspace.dependencies]
# internal
folkmoot-common = { path = "crates/common" }

# http
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ids / time / hashing
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"

# errors
thiserror = "2"
anyhow = "1"

# api docs
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# db
rusqlite = { version = "0.32", features = ["bundled"] }

# cli
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
